            - heading "It’s either cached or it isn’t." [level=2] [ref=e176]
            - generic [ref=e177]:
              - paragraph [ref=e178]:
                - text: We believed it, too — hit or miss, there or not. But “cached” is not a state a page is in; it is a bake with a lifespan.
                - code [ref=e179]: use cache
                - text: bakes a component’s output into the page’s static shell — one copy, served to everyone — and a cache tag is the handle you pull to throw that copy away. Pulling it empties the shelf and lights no oven. The fresh page is baked when the next request asks for one, and not a moment before.
              - paragraph [ref=e180]: The stamp below is that copy — this page’s own cache entry, wearing a six-character fingerprint so you can tell one bake from the next. Press the button and a fresh bake lands for every visitor, in the time it takes the label to change back. It feels like one event.
              - paragraph [ref=e181]:
                - text: "It is three. Flip the switch and run it again in slow motion — the panel narrates each event as it happens. Watch the color: it changes twice, not once, and that gap is what your cache logs are naming. Press the button here and the next request logs"
                - code [ref=e182]: REVALIDATED
                - text: "— reason:"
                - code [ref=e183]: tag-based deletion
                - text: — because that request was the refill.
                - code [ref=e184]: STALE
                - text: "is the same gap handled softly: the old bake served while a fresh one is in the oven."
