            - heading "Frequently asked questions" [level=2] [ref=e444]
            - heading "Before you poke anything." [level=2] [ref=e445]
          - generic [ref=e446]:
            - generic [ref=e448]:
              - heading "What exactly am I looking at?" [level=3] [ref=e449]
              - paragraph [ref=e451]: A place to find out what happens when you press things. Each chapter pairs a demo with its source — press the button, watch the cache expire, read the code that did it. The plan is to cover everything Next.js and Vercel can do, one chapter at a time. The official docs are good; this is the lab bench that belongs next to them.
            - generic [ref=e453]:
              - heading "Is this official?" [level=3] [ref=e454]
              - paragraph [ref=e456]: No. Vercel hasn’t endorsed this site, and nobody on the Next.js team sees a chapter before it ships. The mistakes are ours, and so is the freedom to say which parts are confusing.
            - generic [ref=e458]:
              - heading "Is this free?" [level=3] [ref=e459]
              - generic [ref=e460]:
                - paragraph [ref=e461]: "The playground is free. Completely, permanently, no-asterisk free. The paid thing is coaching: small cohorts where you build production apps with me on exactly these topics, AI workflow included. The page teaches; the cohort makes it stick."
                - paragraph [ref=e462]: //The playground doesn’t get better if you buy the cohort. It’s the same page either way.
            - generic [ref=e464]:
              - heading "Who is this for?" [level=3] [ref=e465]
              - paragraph [ref=e467]: Anyone from “I want to build things but don’t code yet” to “I have opinions about caching strategies”. If you’ve ever refreshed a page wondering why your update didn’t show up, or sprinkled “use client” everywhere just to be safe, you’re the audience. Beginners get footing. Seniors get a reference they can poke.
            - generic [ref=e469]:
              - heading "Why not just read the docs?" [level=3] [ref=e470]
              - paragraph [ref=e472]: Do read the docs — we link them from every chapter, on purpose. But reading about streaming and watching three skeletons resolve in delay order are different kinds of knowing. Docs tell you how it works. A playground lets you find out what happens.
